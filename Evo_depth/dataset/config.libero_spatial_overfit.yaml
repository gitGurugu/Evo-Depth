# Single-suite overfit: libero_spatial only. Same dims/view_map as config.libero.yaml.
# Usage:
#   DATASET_CONFIG=$PWD/Evo_depth/dataset/config.libero_spatial_overfit.yaml \
#     bash scripts/run_litegauss_train.sh --name overfit-spatial --steps 2000 --batch-size 16 --warmup-steps 50
max_action_dim: 24
max_state_dim: 24
max_views: 3

data_groups:
  libero_franka:
    libero_spatial_no_noops_1.0.0_lerobot:
      path: /root/Evo-Depth/data/libero/libero_spatial_no_noops_1.0.0_lerobot
      view_map:
        image_1: observation.images.image
        image_2: observation.images.wrist_image
